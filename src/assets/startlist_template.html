<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Startovní listina</title>
  <style>
    :root {
      --text:#1a1a1a;
      --muted:#666;
      --border:#ddd;
      --brand:#0f766e;      /* teal-700 */
      --brand-soft:#e6fffb; /* jemné pozadí */
      --row:#fafafa;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: Arial, sans-serif;
      color: var(--text);
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .wrap {
      padding: 20mm 12mm 16mm;
      page-break-inside: avoid;
    }

    header.header {
      display: grid;
      grid-template-columns: auto 1fr;
      grid-column-gap: 16px;
      align-items: center;
      margin-bottom: 10mm;
      border-bottom: 2px solid var(--brand);
      padding-bottom: 8px;
    }

    .logo {
      height: 42px;
      width: auto;
      object-fit: contain;
    }

    .titleblock {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    h1 {
      font-size: 20px;
      margin: 0;
      color: var(--brand);
      letter-spacing: .2px;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .meta b { color: var(--text); font-weight: 600; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8mm;
      font-size: 12px;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--brand-soft);
      color: #0b4f4a;
      border: 1px solid var(--brand);
      padding: 6px 8px;
      text-align: center;
      font-weight: 700;
    }

    tbody td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: center;
      vertical-align: middle;
      word-break: break-word;
    }

    tbody tr:nth-child(odd) td { background: #fff; }
    tbody tr:nth-child(even) td { background: var(--row); }

    /* Zabraň přelomení řádku uprostřed */
    tr { page-break-inside: avoid; }

    /* Dlouhé tabulky – nech thead opakovat (Puppeteer to řeší přes headerTemplate, ale styl necháme hezký) */
    thead { display: table-header-group; }
    tfoot { display: table-footer-group; }

    /* Chytré šířky sloupců – první sloupec úzký, poslední flexibilní */
    thead th:first-child, tbody td:first-child { width: 1%; white-space: nowrap; }
    /* Mírně širší textové sloupce – uprav dle potřeby: */
    /* thead th:nth-child(2), tbody td:nth-child(2) { width: 18%; } */

    /* Titulek tabulky (volitelný) */
    .table-title {
      font-size: 14px;
      margin-top: 4mm;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div>{{logo}}</div>
      <div class="titleblock">
        <h1>Startovní listina</h1>
        <div class="meta">
          <div><b>Soutěž:</b> {{competitionName}}</div>
          <div><b>Datum:</b> {{date}}</div>
          <div><b>Disciplína:</b> {{discipline}}</div>
          <div><b>Kategorie:</b> {{category}}</div>
        </div>
      </div>
    </header>

    <table>
      <thead>
        <tr>
          {{thead}}
        </tr>
      </thead>
      <tbody>
        {{tbody}}
      </tbody>
    </table>
  </div>
</body>
</html>
