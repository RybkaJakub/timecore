<div class="pl-6 pr-6 mb-6 space-y-8">
  <style>
    .highlighted {
      background: linear-gradient(to right, rgba(59,130,246,0.18), rgba(59,130,246,0.06));
      border-left: 4px solid #3b82f6;
      box-shadow: inset 0 0 8px rgba(59,130,246,0.3);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .highlighted td {
      font-weight: 600;
      color: #f3f4f6; /* Tailwind gray-100 */
    }
    .highlighted:hover {
      background: linear-gradient(to right, rgba(37,99,235,0.25), rgba(37,99,235,0.1));
      box-shadow: inset 0 0 10px rgba(37,99,235,0.4);
    }

    /* horizontální scroll podle tutoriálu */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid #374151; /* gray-700 */
  border-radius: .5rem;
}

/* sticky header + vertikální scroll jen v řádcích */
.table-scroll {
  border-collapse: collapse;
  width: 100%;
  table-layout: fixed; /* všechny sloupce mají přesně danou šířku */
}
.table-scroll thead {
  position: sticky;
  top: 0;
  z-index: 2;
}
.table-scroll th,
.table-scroll td {
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
}
.table-scroll tbody { display: block; max-height: 48vh; overflow-y: auto; }
.table-scroll tbody::-webkit-scrollbar { width: 10px; }
.table-scroll tbody::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 6px; }
.table-scroll tbody::-webkit-scrollbar-track { background: #1f2937; }

  </style>

  <!-- Nadpis a tlačítko pro výsledky -->
  <div class="flex items-center justify-between">
    <h2 class="text-3xl font-bold text-white flex items-center gap-3">⏱️ Měření</h2>
    <div class="flex items-center gap-2">
      <select id="displaySelect" class="p-2 rounded bg-gray-800 text-white border border-gray-600"></select>
      <button id="toggleResultsBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow">
        📺 Zobrazit výsledky
      </button>
    </div>
  </div>

  <!-- Ovládací tlačítka -->
  <div class="flex flex-wrap gap-4">
    <button id="stopResetBtn" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded shadow disabled:opacity-50 transition">
      ⏹️ Stop / 🔁 Reset
    </button>
  </div>

  <!-- Výběr portu a status -->
  <div class="flex flex-wrap items-center gap-4">
    <select id="serialPortSelect" class="bg-gray-800 text-white p-2 rounded border border-gray-600 focus:ring-2 focus:ring-blue-500"></select>
    <button id="connectSerialBtn" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded shadow transition">🔌 Připojit</button>
    <button id="disconnectBtn" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded shadow hidden transition">❌ Odpojit</button>
    <span id="serialStatus" class="text-sm text-gray-300">Nepřipojeno</span>
  </div>

  <!-- Timer display -->
<div class="flex justify-center mt-4">
  <div id="timerDisplay" class="text-6xl font-bold text-white tracking-wider bg-gray-800 px-8 py-4 rounded shadow-inner border border-gray-700">

    <!-- Požární útok -->
    <div class="flex items-center justify-center gap-8 utok hidden">

        <div class="text-xs text-gray-400 mb-1">LP</div>
        <div class="text-5xl font-bold text-green-400 lpTime">-</div>
      </div>
      <div class="text-center">
        <div class="text-xs text-gray-400 mb-1">PP</div>

</div>


  <!-- Výběry -->
  <div class="flex flex-wrap items-center gap-4">
    <select id="measurementCategory" class="bg-gray-800 text-white p-2 rounded border border-gray-600 focus:ring-2 focus:ring-blue-500"></select>

    <div id="heatContainer" class="hidden flex items-center gap-2">
      <label for="heatSelect" class="text-gray-300 text-sm">Rozběh:</label>
      <select id="heatSelect" class="bg-gray-800 text-white p-2 rounded border border-gray-600 focus:ring-2 focus:ring-blue-500"></select>
    </div>

    <div id="attemptContainer" class="hidden flex items-center gap-2">
      <label for="attemptSelect" class="text-gray-300 text-sm">Pokus:</label>
