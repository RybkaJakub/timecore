<div class="pl-6 pr-6 mb-6 space-y-8 page-root">
  <style>
    /* === stejné ladění rozložení + tabulky jako ve vzoru === */
    #main-content { min-height: 0; }
    #main-content > .page-root { height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

    :root{--line:#1f2a44;--panel:#0f172a;--brand:#3b82f6}
    .panel{background:#0f172a;border:1px solid var(--line);border-radius:14px;padding:14px}
    .section-title{display:flex;align-items:center;gap:.6rem;color:#fff;font-weight:800;letter-spacing:.2px}
    .select{background:#0b1326;border:1px solid var(--line);color:#e5e7eb;border-radius:.65rem;padding:.55rem .7rem}
    .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem .9rem;border-radius:.7rem;font-weight:700;color:#fff;border:1px solid transparent}
    .btn-primary{background:var(--brand)} .btn-primary:hover{background:#2563eb}
    .btn-ghost{background:#13203b;border:1px solid var(--line)} .btn-ghost:hover{background:#1a2a4b}

    .table-wrap{width:100%;height:100%;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#0b1326}
    .table{border-collapse:separate;border-spacing:0;width:100%}
    .table thead, .table tbody tr{display:table;width:100%;table-layout:fixed}
    .table thead th{
      position:sticky;top:0;z-index:2;background:#0f172a;color:#cbd5e1;
      font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
      border-bottom:1px solid var(--line);padding:.6rem .75rem
    }
    .table tbody{display:block;max-height:100%;overflow-y:auto;scrollbar-gutter:stable}
    .table td{padding:.55rem .75rem;border-bottom:1px dashed rgba(148,163,184,.25);color:#d1d5db;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .table tbody tr:nth-child(odd) td{background:rgba(2,6,23,.18)}
    .table tbody tr:hover td{background:rgba(59,130,246,.06)}
    .table tbody::-webkit-scrollbar{width:12px}
    .table tbody::-webkit-scrollbar-thumb{background:#2b354f;border:3px solid #0b1326;border-radius:9999px}
    .table tbody::-webkit-scrollbar-thumb:hover{background:#3a4767}

    .td-center{text-align:center}
    .td-right{text-align:right}
    .td-dim{color:#94a3b8}
    .text-red-400{color:rgb(248 113 113)!important}
  </style>

  <!-- MODAL: výběr disciplíny -->
  <div id="relayTypeModal" class="fixed inset-0 bg-black/60 flex items-center justify-center hidden z-50">
    <div class="panel w-[560px]">
      <h3 class="section-title text-2xl mb-3">Vyber disciplínu štafety</h3>
      <p class="text-slate-300 mb-4">Uloží se k soutěži. Později lze změnit (dvojité potvrzení).</p>
      <div class="flex gap-3">
        <button id="choose4x60" class="btn btn-primary">Štafeta 4×60</button>
        <button id="choosePairs" class="btn btn-ghost">Štafeta dvojic</button>
      </div>
    </div>
  </div>

  <!-- MODAL: změna disciplíny – dvojí potvrzení -->
  <div id="relayTypeChangeModal" class="fixed inset-0 bg-black/60 flex items-center justify-center hidden z-50">
    <div class="panel w-[560px]">
      <h3 class="section-title text-2xl mb-3">Změnit disciplínu?</h3>
      <p class="text-slate-300">Změna může ovlivnit uložená data. Pokračovat?</p>
      <div class="mt-4 flex gap-2">
        <button id="relayChangeConfirm1" class="btn btn-ghost">Ano, pokračovat</button>
        <button id="relayChangeCancel1" class="btn">Zrušit</button>
      </div>
      <div id="relayChangeStep2" class="hidden mt-4">
        <p class="text-red-300 mb-2">Definitivně změnit disciplínu?</p>
        <div class="flex gap-2">
          <button id="relayChangeConfirm2" class="btn btn-primary">Ano, změnit</button>
          <button id="relayChangeCancel2" class="btn">Ne, zpět</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h2 class="section-title text-3xl">🧭 <span class="text-white">Zápis štafet</span></h2>
    <button id="relayTypeChangeBtn" class="btn btn-ghost">Změnit disciplínu</button>
  </div>

  <!-- Filtry -->
  <div class="panel">
    <div class="flex flex-wrap items-center gap-3">
      <select id="resultsCategorySelect" class="select">
        <option value="">Vyber kategorii</option>
      </select>
    </div>
  </div>

  <!-- Tabulka -->
  <div class="table-wrap" style="height: calc(100vh - 300px);">
    <table class="table text-sm">
      <thead>
        <tr>
          <th class="w-20">Start. č.</th>
          <th class="w-64">Tým</th>
          <th class="w-28">Pokus</th>
          <th class="w-40">Čas (s)</th>
          <th class="w-44">Platný</th>
          <th class="w-40">Výsledek</th>
        </tr>
      </thead>
      <tbody id="resultsRows">
        <tr id="resultsEmpty">
          <td colspan="99" class="text-center py-8 text-slate-400">Zvol kategorii pro zobrazení.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
