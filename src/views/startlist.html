<div class="px-6 mb-8 space-y-6">

  <style>
    [hidden]{ display:none !important; }

    /* --- Table layout & scroll --- */
    .table-wrap{width:100%;overflow-x:auto;border:1px solid #374151;border-radius:.75rem;background:#111827}
    .table-scroll{border-collapse:separate;border-spacing:0;width:100%}
    .table-scroll thead,.table-scroll tbody tr{display:table;width:100%;table-layout:fixed}
    .table-scroll thead th{position:sticky;top:0;z-index:2;background:#111827;border-bottom:1px solid #374151}
    .table-scroll tbody{display:block;max-height:52vh;overflow-y:auto}
    .table-scroll tbody::-webkit-scrollbar{width:10px}
    .table-scroll tbody::-webkit-scrollbar-thumb{background:#4b5563;border-radius:6px}
    .table-scroll tbody::-webkit-scrollbar-track{background:#1f2937}

    /* --- Make .hidden actually hide TRs despite display:table --- */
    .table-scroll tbody tr.hidden{display:none !important}

    /* --- Subtle separators and zebra --- */
    .row-card{border-bottom:1px dashed rgba(75,85,99,.5)}
    .row-card:nth-child(odd){background:rgba(31,41,55,.35)}
    .row-card:hover{background:rgba(55,65,81,.6)}

    /* --- Inline editable affordance --- */
    td[contenteditable="true"]{outline:none;transition:box-shadow .15s,background .15s}
    td[contenteditable="true"]:focus{box-shadow:0 0 0 2px #2563eb inset;background:rgba(37,99,235,.08)}

    /* --- Small badge style --- */
    .badge{display:inline-flex;align-items:center;gap:.375rem;padding:.25rem .5rem;border-radius:9999px;font-size:.75rem;font-weight:600}
    .badge-live{background:#22d3ee20;color:#22d3ee;border:1px solid #22d3ee40}
    .badge-count{background:#10b98120;color:#10b981;border:1px solid #10b98140}

    /* --- Buttons group --- */
    .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem .85rem;border-radius:.6rem;font-weight:600}
    .btn-ghost{background:#37415180;border:1px solid #4b5563}
    .btn-ghost:hover{background:#4b5563}
    .btn-primary{background:#2563eb}
    .btn-primary:hover{background:#1d4ed8}
    .btn-warn{background:#eab308;color:#111827}
    .btn-warn:hover{background:#d4a106}
    .btn-good{background:#059669}
    .btn-good:hover{background:#047857}
    .btn-danger{background:#dc2626}
    .btn-danger:hover{background:#b91c1c}

    /* --- Inputs --- */
    .input{background:#111827;border:1px solid #374151;color:#f9fafb;border-radius:.6rem;padding:.6rem .8rem}
    .input:focus{outline:none;box-shadow:0 0 0 2px #2563eb}
    .select{background:#111827;border:1px solid #374151;color:#e5e7eb;border-radius:.6rem;padding:.6rem .8rem}

    /* --- Search wrapper --- */
    .search-wrap{position:relative;min-width:280px}
    .search-wrap .icon{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);opacity:.7}
    .search-wrap .clear{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);opacity:.8}
    .search-input{padding-left:2.1rem;padding-right:2rem}

    /* --- Empty state --- */
    .empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.75rem;padding:2.5rem;color:#9ca3af}
    .empty .emoji{font-size:2rem}
    .tooltip-group > button[disabled],
.btn.btn-good[disabled]{
  cursor: not-allowed !important;
  opacity: .75;               /* volitelné ztlumení */
}

.tooltip-group > button[disabled]:hover,
.btn.btn-good[disabled]:hover{
  background: #059669 !important; /* základní zelená bez ztmavení */
}

.tooltip-group > button[disabled]:active{
  transform: none; /* žádné klik animace */
}

    /* Bubble: "Tato funkce je ve vývoji" */
.tooltip-group{position:relative;display:inline-block}
.tooltip-wip{
  position:absolute;bottom:calc(100% + 8px);left:50%;
  transform:translateX(-50%) translateY(4px);
  background:#111827;color:#e5e7eb;border:1px solid #374151;
  border-radius:.5rem;font-size:.75rem;padding:.35rem .55rem;
  white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;
  box-shadow:0 6px 20px rgba(0,0,0,.35)
}
.tooltip-group:hover .tooltip-wip{opacity:1;transform:translateX(-50%) translateY(0)}
.tooltip-wip::after{
  content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%) rotate(45deg);
  width:8px;height:8px;background:#111827;border-right:1px solid #374151;border-bottom:1px solid #374151
}

  </style>

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h2 class="text-2xl sm:text-3xl font-bold text-white flex items-center gap-3">
      🏁 <span class="text-primary">Startovní listina</span>
      <span id="rowsCountBadge" class="badge badge-count">0 položek</span>
    </h2>
    <div class="hidden sm:flex items-center gap-2">
      <!-- <button id="exportExcelBtn" class="btn btn-good">⬆️ Excel</button> -->
      <div class="tooltip-group">
  <button
    type="button"
    disabled
    class="btn btn-good">
    ⬆️ Excel
  </button>
  <span class="tooltip-wip">Tato funkce je ve vývoji</span>
</div>


      <button id="exportPdfBtn" class="btn btn-danger">⬆️ PDF</button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="flex flex-wrap items-center gap-3">
    <select id="categorySelect" class="select">
      <option value="">🎯 Vyber kategorii</option>
    </select>

    <select id="laneCountSelect" class="select hidden">
      <option value="1">1 dráha</option><option value="2">2 dráhy</option>
      <option value="3">3 dráhy</option><option value="4">4 dráhy</option>
    </select>

    <div class="flex items-center gap-2">
      <button id="addStartlistEntryBtn" class="btn btn-primary hidden">➕ Závodník</button>
      <button id="addTeamBtn" class="btn btn-good hidden">➕ Tým</button>
      <button id="generateStartlistBtn" class="btn btn-warn hidden">⚙️ Generovat</button>
    </div>

    <div class="flex gap-2 flex-wrap ml-auto">
      <button id="importCsvBtn" class="btn btn-ghost">⬇️ CSV</button>
      <button id="importExcelBtn" class="btn btn-ghost">⬇️ Excel</button>
      <!-- mobile exports -->
      <div class="sm:hidden flex gap-2">
        <button id="mExportXls" class="btn btn-good">⬆️ Excel</button>
        <button id="mExportPdf" class="btn btn-danger">⬆️ PDF</button>
      </div>
    </div>

    <!-- Search -->
    <div class="search-wrap w-full sm:w-auto">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2"/>
      </svg>
      <input id="searchStartlistInput" type="text" class="input search-input w-full" placeholder="Hledat tým, číslo…">
      <button id="searchClearBtn" class="clear px-2 py-1 rounded hover:bg-gray-700">✖︎</button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap shadow ring-1 ring-gray-700/60">
    <table class="table-scroll text-sm text-gray-200">
      <thead id="startlistHead" class="uppercase text-xs tracking-wide">
        <!-- plní se dynamicky -->
      </thead>
      <tbody id="startlistRows">
        <!-- prázdný stav -->
        <tr id="emptyStateRow">
          <td colspan="99" class="empty">
            <div class="emoji">🗂️</div>
            <div>Zatím tu nic není. Vyber kategorii nebo přidej nový záznam.</div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal: Přidání závodníka -->
<div id="modal-add-runner" class="modal hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center">
  <div class="bg-gray-800 w-full max-w-md rounded-xl border border-blue-500 p-6 shadow-xl">
    <h3 class="text-xl font-semibold mb-4">➕ Přidat závodníka</h3>

    <div class="space-y-3">
      <input id="runnerName"    type="text" class="w-full p-2 rounded bg-gray-700 text-white" placeholder="Jméno">
      <input id="runnerSurname" type="text" class="w-full p-2 rounded bg-gray-700 text-white" placeholder="Příjmení">
      <input id="runnerTeam"    type="text" class="w-full p-2 rounded bg-gray-700 text-white" placeholder="Tým">
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button id="cancelRunnerBtn" class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded">Zrušit</button>
      <button id="saveRunnerBtn"   class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded">Uložit</button>
    </div>
  </div>
</div>

<!-- Modal: Přidání týmu -->
<div id="modal-add-team" class="modal hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center">
  <div class="bg-gray-800 w-full max-w-md rounded-xl border border-green-500 p-6 shadow-xl">
    <h3 class="text-xl font-semibold mb-4">➕ Přidat tým</h3>

    <div class="space-y-3">
      <input id="teamName"           type="text" class="w-full p-2 rounded bg-gray-700 text-white" placeholder="Název týmu">
      <input id="teamStartPosition"  type="text" class="w-full p-2 rounded bg-gray-700 text-white" placeholder="Startovní pořadí (číslo)">
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button id="cancelTeamBtn" class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded">Zrušit</button>
      <button id="saveTeamBtn"   class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded">Uložit</button>
    </div>
  </div>
</div>
